parameters:
  upload_directory: '%kernel.project_dir%/public/uploads'
  profile_pictures_directory: '%kernel.project_dir%/public/uploads/profile_pictures'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude:
      - '../src/DependencyInjection/'
      - '../src/Entity/'
      - '../src/Kernel.php'

  App\Controller\:
    resource: '../src/Controller/'
    tags: ['controller.service_arguments']

  # Configuration explicite de TmdbService
  App\Service\TmdbService:
    arguments:
      $apiKey: '%env(TMDB_API_KEY)%'

when@test:
  services:
    _defaults:
      autowire: true
      autoconfigure: true