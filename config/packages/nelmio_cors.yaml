nelmio_cors:
  defaults:
    origin_regex: true
    allow_origin: ['http://localhost:5173', 'http://localhost:3000', 'http://127.0.0.1:5173']
    allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
    allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With', 'Accept']
    expose_headers: ['Link']
    max_age: 3600
    allow_credentials: true
  paths:
    '^/api/':
      allow_origin: ['*']
      allow_headers: ['*']
      allow_methods: ['GET', 'POST', 'PUT', 'PATCH', 'DELETE', 'OPTIONS']
      max_age: 3600
    '^/browse/':
      allow_origin: ['*']
      allow_headers: ['*']
      allow_methods: ['GET', 'OPTIONS']
      max_age: 3600