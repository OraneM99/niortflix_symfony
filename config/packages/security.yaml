# config/packages/security.yaml
security:
  # Encodeur de mots de passe
  password_hashers:
    Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

  # Provider utilisateur
  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    # ============================================
    # ROUTES PUBLIQUES (sans authentification)
    # ============================================
    # Routes d'authentification
    auth_public:
      pattern: ^/api/auth/(login|register|logout)
      stateless: true
      security: false

    # ============================================
    # ROUTES PROTÉGÉES (avec JWT obligatoire)
    # ============================================
    api:
      pattern: ^/api
      stateless: true
      jwt: ~

    main:
      lazy: true

  # Contrôle d'accès détaillé
  access_control:
    # ============================================
    # Routes PUBLIQUES - Accessible sans token
    # ============================================
    # Auth
    - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/logout, roles: PUBLIC_ACCESS }
    - { path: ^/api/series/home$, roles: PUBLIC_ACCESS }
    - { path: ^/api/series, roles: IS_AUTHENTICATED_FULLY }

    # ============================================
    # Routes PROTÉGÉES - Token JWT requis
    # ============================================
    # Profil utilisateur
    - { path: ^/api/auth/profile, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/auth/verify, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/profile, roles: IS_AUTHENTICATED_FULLY }

    # Browse (trending, popular, top-rated)
    - { path: ^/api/browse/trending, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/browse/popular, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/browse/top-rated, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/browse, roles: IS_AUTHENTICATED_FULLY }

    # Séries locales
    - { path: ^/api/series, roles: IS_AUTHENTICATED_FULLY }
    - { path: ^/api/serie, roles: IS_AUTHENTICATED_FULLY }

    # Trending scheduler
    - { path: ^/api/trending, roles: IS_AUTHENTICATED_FULLY }

    # Toutes les autres routes /api/* nécessitent une authentification
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10